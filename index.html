<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Tracking + Three.js Cube</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    #three-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #debug-video {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 220px;
      border: 1px solid #333;
      border-radius: 8px;
      opacity: 0.85;
      transform: scaleX(-1);
    }

    .info {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #222;
      border-radius: 8px;
      padding: 10px 12px;
      line-height: 1.45;
      max-width: 360px;
      font-size: 14px;
    }

    .info code {
      color: #78e0ff;
    }
  </style>
</head>
<body>
  <canvas id="three-canvas"></canvas>

  <!-- Video ditampilkan kecil sebagai debug agar pemula bisa lihat kamera aktif -->
  <video id="debug-video" autoplay playsinline muted></video>

  <div class="info">
    <strong>Kontrol:</strong><br />
    1) Gerakkan <code>telunjuk</code> untuk memindahkan cube.<br />
    2) Lakukan gesture <code>pinch</code> (jempol + telunjuk) untuk memperbesar cube.
  </div>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- MediaPipe Hands + Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    // ======================
    // 1) Setup Three.js Scene
    // ======================
    const canvas = document.getElementById('three-canvas');
    const scene = new THREE.Scene();

    const camera3D = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera3D.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Cube wireframe agar terlihat keren
    const geometry = new THREE.BoxGeometry(1.3, 1.3, 1.3);
    const material = new THREE.MeshBasicMaterial({
      color: 0x00ffff,
      wireframe: true
    });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    // Variabel target untuk gerakan halus (smoothing)
    const targetPosition = new THREE.Vector3(0, 0, 0);
    const defaultScale = 1;
    let targetScale = defaultScale;

    // =========================
    // 2) Setup Webcam + Mediapipe
    // =========================
    const videoElement = document.getElementById('debug-video');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    // Utility helper
    const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

    hands.onResults((results) => {
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

      const landmarks = results.multiHandLandmarks[0];

      // Landmark index:
      // 4  = ujung jempol
      // 8  = ujung telunjuk
      const thumbTip = landmarks[4];
      const indexTip = landmarks[8];

      // =============================
      // 3) Pindahkan cube pakai telunjuk
      // =============================
      // Koordinat MediaPipe adalah normalized (0..1)
      // X kanan meningkat, Y ke bawah meningkat.
      // Kita konversi ke world coords sederhana.
      const x = (indexTip.x - 0.5) * 8;
      const y = -(indexTip.y - 0.5) * 5;

      targetPosition.set(x, y, 0);

      // =========================================
      // 4) Pinch (jempol + telunjuk) untuk scale up
      // =========================================
      const pinchDistance = Math.hypot(
        indexTip.x - thumbTip.x,
        indexTip.y - thumbTip.y,
        indexTip.z - thumbTip.z
      );

      // Mapping distance ke skala:
      // lebih kecil distance => pinch lebih rapat => objek lebih besar
      const mappedScale = 2.8 - pinchDistance * 18;
      targetScale = clamp(mappedScale, 0.8, 3.5);
    });

    const mpCamera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    mpCamera.start().catch((error) => {
      console.error('Tidak bisa mengakses kamera:', error);
      alert('Kamera tidak bisa diakses. Pastikan izin kamera aktif dan gunakan HTTPS atau localhost.');
    });

    // ======================
    // 5) Animation Loop
    // ======================
    function animate() {
      requestAnimationFrame(animate);

      // Rotasi halus agar lebih hidup
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.015;

      // Smoothing posisi dan skala
      cube.position.lerp(targetPosition, 0.2);
      const smoothScale = THREE.MathUtils.lerp(cube.scale.x, targetScale, 0.2);
      cube.scale.setScalar(smoothScale);

      renderer.render(scene, camera3D);
    }

    animate();

    // Responsive resize
    window.addEventListener('resize', () => {
      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
